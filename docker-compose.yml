services:
  web:
    build:
      context: .
      target: dev
    container_name: squad-academy
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Hot reload confiável quando o código está em volume no Windows/OneDrive.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # Banco SQLite persistido fora do bind mount, sem sobrescrever
      # prisma/schema.prisma e prisma/seed.ts.
      - sqlite_data:/app/prisma/data
      - uploads:/app/public/uploads
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  node_modules:
  sqlite_data:
  uploads:
